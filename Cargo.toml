[workspace]
resolver = "3"
members = [
    "trading-runtime",
    "trading-http-api",
    "trading-blueprint-lib",
    "trading-blueprint-bin",
    "trading-validator-lib",
    "trading-validator-bin",
    "trading-instance-blueprint-lib",
    "trading-instance-blueprint-bin",
    "trading-tee-instance-blueprint-lib",
    "trading-tee-instance-blueprint-bin",
]

[workspace.package]
authors = ["Drew Stone"]
edition = "2024"
description = "AI Trading Blueprints for Tangle Network"
license = "MIT OR Apache-2.0"

# Keep Sandbox and Blueprint on the exact revisions tested together upstream.
# Dependency workspace patches do not propagate into consumers, so this
# workspace must repeat them to avoid mixing incompatible Tangle ABIs.
[patch.crates-io]
blueprint-anvil-testing-utils = { git = "https://github.com/tangle-network/blueprint.git", rev = "9462282a9f72c98a3746b816478b4b889761a537" }
